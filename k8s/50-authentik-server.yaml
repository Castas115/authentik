apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: authentik
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authentik-server
  template:
    metadata:
      labels:
        app: authentik-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: pc2
      containers:
        - name: authentik-server
          image: ghcr.io/goauthentik/server:2026.5.6
          args: ["server"]
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: authentik-secrets, key: AUTHENTIK_SECRET_KEY }
            - name: AUTHENTIK_BOOTSTRAP_EMAIL
              valueFrom:
                secretKeyRef: { name: authentik-secrets, key: AUTHENTIK_BOOTSTRAP_EMAIL }
            - name: AUTHENTIK_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef: { name: authentik-secrets, key: AUTHENTIK_BOOTSTRAP_PASSWORD }
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: authentik-postgres
            - name: AUTHENTIK_POSTGRESQL__NAME
              valueFrom:
                secretKeyRef: { name: authentik-secrets, key: POSTGRES_DB }
            - name: AUTHENTIK_POSTGRESQL__USER
              valueFrom:
                secretKeyRef: { name: authentik-secrets, key: POSTGRES_USER }
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef: { name: authentik-secrets, key: POSTGRES_PASSWORD }
            - name: AUTHENTIK_REDIS__HOST
              value: authentik-redis
            - name: IMMICH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: authentik-oidc-secrets, key: IMMICH_CLIENT_SECRET }
            - name: ACTUAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: authentik-oidc-secrets, key: ACTUAL_CLIENT_SECRET }
            - name: ARGOCD_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: authentik-oidc-secrets, key: ARGOCD_CLIENT_SECRET }
            - name: JELLYFIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: authentik-oidc-secrets, key: JELLYFIN_CLIENT_SECRET }
            - name: WGER_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: authentik-oidc-secrets, key: WGER_CLIENT_SECRET }
          ports:
            - name: http
              containerPort: 9000
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 2Gi }
          readinessProbe:
            httpGet: { path: /-/health/ready/, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/health/live/, port: http }
            initialDelaySeconds: 40
            periodSeconds: 30
          volumeMounts:
            - name: blueprints
              mountPath: /blueprints/custom
      volumes:
        - name: blueprints
          configMap:
            name: authentik-blueprints
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-server
  namespace: authentik
spec:
  selector:
    app: authentik-server
  ports:
    - name: http
      port: 9000
      targetPort: http
