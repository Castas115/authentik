apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: authentik
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authentik-worker
  template:
    metadata:
      labels:
        app: authentik-worker
    spec:
      nodeSelector:
        kubernetes.io/hostname: pc2
      containers:
        - name: authentik-worker
          image: ghcr.io/goauthentik/server:2026.5.6
          args: ["worker"]
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: authentik-secrets, key: AUTHENTIK_SECRET_KEY }
            - name: AUTHENTIK_BOOTSTRAP_EMAIL
              valueFrom:
                secretKeyRef: { name: authentik-secrets, key: AUTHENTIK_BOOTSTRAP_EMAIL }
            - name: AUTHENTIK_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef: { name: authentik-secrets, key: AUTHENTIK_BOOTSTRAP_PASSWORD }
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: authentik-postgres
            - name: AUTHENTIK_POSTGRESQL__NAME
              valueFrom:
                secretKeyRef: { name: authentik-secrets, key: POSTGRES_DB }
            - name: AUTHENTIK_POSTGRESQL__USER
              valueFrom:
                secretKeyRef: { name: authentik-secrets, key: POSTGRES_USER }
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef: { name: authentik-secrets, key: POSTGRES_PASSWORD }
            - name: AUTHENTIK_REDIS__HOST
              value: authentik-redis
            - name: IMMICH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: authentik-oidc-secrets, key: IMMICH_CLIENT_SECRET }
            - name: ACTUAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: authentik-oidc-secrets, key: ACTUAL_CLIENT_SECRET }
            - name: ARGOCD_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: authentik-oidc-secrets, key: ARGOCD_CLIENT_SECRET }
            - name: JELLYFIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: authentik-oidc-secrets, key: JELLYFIN_CLIENT_SECRET }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: blueprints
              mountPath: /blueprints/custom
      volumes:
        - name: blueprints
          configMap:
            name: authentik-blueprints
