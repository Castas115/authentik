apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  immich.yaml: |
    version: 1
    metadata:
      name: immich-oidc
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: immich-provider
        identifiers:
          name: immich
        state: present
        attrs:
          name: immich
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: immich
          client_secret: !Env IMMICH_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://immich.home/auth/login
            - matching_mode: strict
              url: https://immich.home/user-settings
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        identifiers:
          slug: immich
        state: present
        attrs:
          name: Immich
          slug: immich
          provider: !KeyOf immich-provider
  actual.yaml: |
    version: 1
    metadata:
      name: actual-oidc
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: actual-provider
        identifiers:
          name: actual
        state: present
        attrs:
          name: actual
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: actual
          client_secret: !Env ACTUAL_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://actual.home/openid/callback
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        identifiers:
          slug: actual
        state: present
        attrs:
          name: Actual Budget
          slug: actual
          provider: !KeyOf actual-provider
  argocd.yaml: |
    version: 1
    metadata:
      name: argocd-oidc
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        identifiers:
          name: argocd
        state: present
        attrs:
          name: argocd
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: argocd
          client_secret: !Env ARGOCD_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.home/auth/callback
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        identifiers:
          slug: argocd
        state: present
        attrs:
          name: ArgoCD
          slug: argocd
          provider: !KeyOf argocd-provider
  forwardauth.yaml: |
    version: 1
    metadata:
      name: forwardauth-proxy
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: forwardauth-provider
        identifiers:
          name: forwardauth
        state: present
        attrs:
          name: forwardauth
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_domain
          external_host: https://auth.home
          cookie_domain: home
      - model: authentik_core.application
        identifiers:
          slug: forwardauth
        state: present
        attrs:
          name: Forward Auth
          slug: forwardauth
          provider: !KeyOf forwardauth-provider
      - model: authentik_outposts.outpost
        identifiers:
          name: authentik Embedded Outpost
        state: present
        attrs:
          providers:
            - !KeyOf forwardauth-provider
